# EasyLab umbrella values. The easylab gateway, NATS broker, and the abc agent
# run as SEPARATE Deployments (no sidecars) and talk over Service DNS.

# Namespace the objects land in. Leave empty to use the release namespace
# (install with `-n temp`); also where easylab creates sandboxes / CI build
# pods / service deployments at runtime.
namespaceOverride: ""

nameOverride: ""

# OCI registry host (no scheme) that easylab serves: where builds push and
# nodes/workers pull derived images from. Leave empty to derive it from the
# install namespace (easylab.<ns>.svc.cluster.local:80), the portable default
# for the in-cluster Service approach. Set an external host only if the
# deployment exposes the registry on an ingress.
registry:
  host: ""

# ---- gateway (easylab Go binary) ----
gateway:
  image:
    repository: forgejo.develop.10.199.64.20.nip.io/easylab/easylab
    tag: "20260915130000"
    pullPolicy: IfNotPresent
  # External base URL advertised to clients (OCI /token realm, git, ...).
  # Empty derives it from the install namespace: the in-cluster Service URL
  # http://easylab.<ns>.svc.cluster.local (port 80). Set an external URL only
  # when clients outside the cluster must reach the gateway.
  selfBase: ""
  token: devtoken
  # Static admin credential for user administration (UserService create/update/
  # delete + token minting). Sent as the bearer credential; distinct from the
  # user tokens above.
  adminToken: admin-devtoken
  # User name of the bootstrapped operator (owns the fixed token above).
  bootstrapUser: operator
  # Artifact (OCI + /pkgs) base URL used by builds. Empty derives
  # http://easylab.<ns>.svc.cluster.local:80.
  artifactURL: ""
  # Maximum upload body (bytes) for the package/OCI registry. Large VM images
  # (30+ GB layers) need this well above the 8 GiB default.
  maxBodyBytes: "34359738368"
  # Upstream HTTP(S) proxy for build pods reaching public registries. This is
  # environment-specific; empty disables it (clusters with direct egress).
  upstreamProxy: http://mihomo.develop.svc.cluster.local:7890
  enforceH2: "0"
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  service:
    type: ClusterIP
    port: 80

# ---- Kubernetes execution backend tuning ----
backend:
  # One-container buildkit-worker (buildkitd + easyworker); easylab runs
  # builds as worker jobs. Image ref is qualified with the registry host.
  buildkitImage: forgejo.develop.10.199.64.20.nip.io/easylab/buildkit-worker:20260912153825
  # Egress-proxy (easysidecar) image injected into sandbox/job/
  # service/job pods. Must be fully qualified so the NODE can pull it (a bare
  # `easylab/...` name would be resolved against docker.io and fail).
  egressImage: forgejo.develop.10.199.64.20.nip.io/easylab/easysidecar:v0.7.0
  # When "1", the egress-proxy sidecar is NOT injected (workloads egress
  # directly). Prefer `egressMode` instead: disabling also loses the
  # env-proxy fallback.
  egressPolicyDisabled: ""
  # Interception mode:
  #   ""/"spoof"  DNS-based, no netfilter/NET_ADMIN (default)
  #   "capture"   privileged all-port interception: an init container
  #               redirects every outbound TCP connection to the sidecar,
  #               which recovers the destination via SO_ORIGINAL_DST. Needs
  #               NET_ADMIN on the sidecar + init container.
  egressMode: ""
  # Cluster resolver the spoof sidecar forwards real queries to (CoreDNS
  # service IP). Required for auto/spoof mode.
  egressSpoofDNS: ""
  # Optional egress HTTP proxy (mihomo) that spoof DIRECT traffic is sent
  # through, so cluster egress policy still applies.
  egressUpstreamProxy: ""
  # Host path backing the /data hostPath mount (ephemeral build pods read the
  # build context + write logs there).
  hostDataDir: /home/develop/.easylab

# ---- Sandbox runtimes ----
# Per-runtime overrides merged over easylab's built-in profiles. The linux
# profile is derived (base image + injected worker); windows/macos are VM
# worker images served by easylab's registry (mirrored into it). Values here
# are rendered to EASYLAB_SANDBOX_RUNTIMES (JSON) on the gateway.
sandboxes:
  # VM worker images: <vmImagePrefix>/easyworker-<runtime>:<vmTag>. Bump vmTag
  # to move windows/macos to a new easyworker VM release in one place.
  vmImagePrefix: easylab/vm-images
  vmTag: v1.2.2
  runtimes:
    windows:
      readyTimeout: 15m
      nodeSelector:
        kubernetes.io/hostname: iv-yebxendp8gwh2yokqhjs
      imagePullSecrets: []
    macos:
      readyTimeout: 15m
      nodeSelector:
        kubernetes.io/hostname: iv-yebxendp8gwh2yokqhjs
      imagePullSecrets: []

# ---- NATS broker (separate Deployment) ----
nats:
  image:
    repository: forgejo.develop.10.199.64.20.nip.io/easylab/nats
    tag: latest
    pullPolicy: IfNotPresent
  # Service name other workloads address (nats.<ns>.svc:4222).
  service:
    name: nats
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ---- abc agent (session/model/turn engine, h2c) ----
agent:
  image:
    repository: forgejo.develop.10.199.64.20.nip.io/easylab/agent
    # v2 (multi-tenant protocol). Phase 1 rollout: auth disabled, every
    # request pinned to the default tenant; flip to required (+ admin/bootstrap
    # tokens) in phase 2.
    tag: "20260914163825"
    pullPolicy: IfNotPresent
  # Service name published for the agent (repo extension defaults to this).
  serviceName: abcp-agent
  port: 8000
  corsOrigin: "*"
  # Tools the host hard-disables for EVERY session regardless of its preset
  # whitelist. easylab ships its own branch/messaging flow (repo-extension
  # `subsession-create`) and talks to it via merge requests, so the bundled
  # agent's subsession/mail tools are masked here (the denylist is the
  # enforcement backstop: a user may still create or blank a preset).
  disabledTools: "bundled.subsession-create,bundled.mail-send"
  extraEnv:
    - name: AGENT_DEFAULT_TENANT
      value: "default"
  # Phase 2 activation: token->tenant auth (required). The bootstrap pair
  # provisions the default tenant (and its credential) on first boot of an
  # empty database; the admin token reaches only the AdminService.
  # Credentials the gateway presents to the agent: every forwarded RPC of the
  # default tenant uses forwardToken; adminToken reaches only the
  # AdminService (tenant provisioning).
  forwardToken: "06801d6eab61494a916b826551dad7ddfd88b43fb1c57a25"
  adminToken: "679d52ee3e238d9984667278afbecc5437705b401fe74b2e"
  # The default tenant's abcp-agent tenant id; the gateway records it (with
  # forwardToken) as the DB binding on startup.
  bootstrapTenant: "default"
  authEnv:
    - name: AGENT_AUTH_MODE
      value: "required"
    - name: AGENT_ADMIN_TOKEN
      value: "679d52ee3e238d9984667278afbecc5437705b401fe74b2e"
    - name: AGENT_BOOTSTRAP_TENANT
      value: "default"
    - name: AGENT_BOOTSTRAP_TOKEN
      value: "06801d6eab61494a916b826551dad7ddfd88b43fb1c57a25"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }
  service:
    type: ClusterIP
    port: 80

# ---- persistence ----
persistence:
  # hostPath root for /data (single-node dev cluster). DirectoryOrCreate.
  hostPath: /home/develop/.easylab
  type: DirectoryOrCreate

# ---- RBAC: easylab ServiceAccount may CRUD its runtime objects in-namespace ----
rbac:
  create: true
  serviceAccount:
    create: true
    name: easylab
