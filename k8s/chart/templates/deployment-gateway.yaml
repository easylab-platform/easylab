apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easylab.name" . }}
  namespace: {{ include "easylab.namespace" . }}
  labels:
    {{- include "easylab.labels" . | nindent 4 }}
    app: {{ include "easylab.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "easylab.name" . }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "easylab.labels" . | nindent 8 }}
        app: {{ include "easylab.name" . }}
    spec:
      serviceAccountName: {{ include "easylab.serviceAccountName" . }}
      containers:
        - name: easylab
          image: {{ include "easylab.gatewayImage" . }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - "-addr"
            - "0.0.0.0:8080"
            # The admin API listens on a separate address, loopback by default,
            # so /artifacts/system is never exposed via the gateway Service.
            - "-admin-addr"
            - {{ .Values.gateway.adminAddr | default "127.0.0.1:8081" | quote }}
          env:
            - name: EASYVCS_HOME
              value: /data
            # External URL advertised to clients (OCI /token realm, protocol
            # registries, self_base) — must be resolvable, never loopback.
            - name: EASYVCS_SELF_BASE
              value: {{ include "easylab.selfBase" . | quote }}
            - name: EASYVCS_REGISTRY
              value: {{ include "easylab.registryHost" . | quote }}
            # Embedded tool extensions reach the split-out nats/agent over
            # Service DNS (no sidecars).
            - name: EASYLAB_EXT_NATS_URL
              value: {{ printf "nats://%s.%s.svc.cluster.local:4222" .Values.nats.service.name (include "easylab.namespace" .) | quote }}
            - name: EASYLAB_AGENT_URL
              value: {{ printf "http://%s.%s.svc.cluster.local" .Values.agent.serviceName (include "easylab.namespace" .) | quote }}
            - name: EASYLAB_AGENT_TOKEN
              value: {{ .Values.agent.forwardToken | quote }}
            - name: EASYLAB_AGENT_ADMIN_TOKEN
              value: {{ .Values.agent.adminToken | quote }}
            # The repo extension's direct agent client authenticates as the
            # default tenant.
            - name: AGENT_API_KEY
              value: {{ .Values.agent.forwardToken | quote }}
            - name: EASYVCS_ENFORCE_H2
              value: {{ .Values.gateway.enforceH2 | quote }}
            - name: EASYVCS_TOKEN
              value: {{ .Values.gateway.token | quote }}
            # Bootstrap the operator credential equal to the fixed token, so
            # EASYVCS_TOKEN/EASYLAB_TOKEN/ARTIFACT_TOKEN are valid registered
            # store tokens. The embedded extensions authenticate with the same
            # credential.
            - name: EASYLAB_BOOTSTRAP_TOKEN
              value: {{ .Values.gateway.token | quote }}
            - name: EASYLAB_BOOTSTRAP_USER
              value: {{ .Values.gateway.bootstrapUser | default "operator" | quote }}
            - name: EASYLAB_TOKEN
              value: {{ .Values.gateway.token | quote }}
            # Static admin credential for user administration (UserService).
            - name: EASYLAB_ADMIN_TOKEN
              value: {{ .Values.gateway.adminToken | default "admin-devtoken" | quote }}
            # The operator's bound abcp-agent tenant id (DB binding mirrors this
            # at startup).
            - name: EASYLAB_AGENT_TENANT
              value: {{ .Values.agent.bootstrapTenant | default "default" | quote }}
            - name: EASYLAB_ARTIFACT_URL
              value: {{ include "easylab.artifactURL" . | quote }}
            - name: ARTIFACT_MAX_BODY
              value: {{ .Values.gateway.maxBodyBytes | default "34359738368" | quote }}
            - name: ARTIFACT_TOKEN
              value: {{ .Values.gateway.token | quote }}
            # ---- Kubernetes execution backend ----
            - name: EASYLAB_NAMESPACE
              value: {{ include "easylab.runtimeNamespace" . | quote }}
            - name: EASYLAB_HOST_DATA_DIR
              value: {{ .Values.backend.hostDataDir | quote }}
            - name: EASYLAB_BUILDKIT_IMAGE
              value: {{ .Values.backend.buildkitImage | quote }}
            - name: EASYLAB_EGRESS_IMAGE
              value: {{ .Values.backend.egressImage | quote }}
            {{- if .Values.backend.egressPolicyDisabled }}
            - name: EASYLAB_EGRESS_POLICY_DISABLED
              value: {{ .Values.backend.egressPolicyDisabled | quote }}
            {{- end }}
            {{- if .Values.backend.egressMode }}
            - name: EASYLAB_EGRESS_MODE
              value: {{ .Values.backend.egressMode | quote }}
            {{- end }}
            {{- if .Values.backend.egressSpoofDNS }}
            - name: EASYLAB_EGRESS_SPOOF_DNS
              value: {{ .Values.backend.egressSpoofDNS | quote }}
            {{- end }}
            {{- if .Values.backend.egressUpstreamProxy }}
            - name: EASYLAB_EGRESS_UPSTREAM_PROXY
              value: {{ .Values.backend.egressUpstreamProxy | quote }}
            {{- end }}
            {{- if .Values.backend.egressMitmDefault }}
            - name: EASYLAB_EGRESS_MITM_DEFAULT
              value: {{ .Values.backend.egressMitmDefault | quote }}
            {{- end }}
            {{- if .Values.backend.egressUDPAllow }}
            - name: EASYLAB_EGRESS_UDP_ALLOW
              value: {{ .Values.backend.egressUDPAllow | quote }}
            {{- end }}
            {{- if .Values.backend.egressUDPMode }}
            - name: EASYLAB_EGRESS_UDP_MODE
              value: {{ .Values.backend.egressUDPMode | quote }}
            {{- end }}
            {{- if .Values.backend.egressDefaultMode }}
            - name: EASYLAB_EGRESS_DEFAULT_MODE
              value: {{ .Values.backend.egressDefaultMode | quote }}
            {{- end }}
            {{- if .Values.backend.egressExemptCIDRs }}
            - name: EASYLAB_EGRESS_EXEMPT_CIDRS
              value: {{ .Values.backend.egressExemptCIDRs | quote }}
            {{- end }}
            {{- if .Values.backend.egressCaptureForward }}
            - name: EASYLAB_EGRESS_CAPTURE_FORWARD
              value: {{ .Values.backend.egressCaptureForward | quote }}
            {{- end }}
            {{- if .Values.backend.egressWebPorts }}
            - name: EASYLAB_EGRESS_WEB_PORTS
              value: {{ .Values.backend.egressWebPorts | quote }}
            {{- end }}
            - name: EASYLAB_REGISTRY_HOST
              value: {{ include "easylab.registryHost" . | quote }}
            {{- if .Values.sandboxes.runtimes }}
            - name: EASYLAB_SANDBOX_RUNTIMES
              value: {{ include "easylab.sandboxRuntimes" . | quote }}
            {{- end }}
            {{- with .Values.gateway.upstreamProxy }}
            - name: EASYLAB_UPSTREAM_PROXY
              value: {{ . | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - { mountPath: /data, name: data }
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: {{ .Values.persistence.type }}
