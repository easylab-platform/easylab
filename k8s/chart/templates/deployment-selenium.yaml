{{- if .Values.selenium.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.selenium.service.name }}
  namespace: {{ include "easylab.namespace" . }}
  labels:
    {{- include "easylab.labels" . | nindent 4 }}
    app: {{ .Values.selenium.service.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.selenium.service.name }}
  template:
    metadata:
      labels:
        {{- include "easylab.labels" . | nindent 8 }}
        app: {{ .Values.selenium.service.name }}
    spec:
      containers:
        - name: selenium
          image: {{ .Values.selenium.image.repository }}:{{ .Values.selenium.image.tag }}
          imagePullPolicy: {{ .Values.selenium.image.pullPolicy }}
          env:
            - name: SE_NODE_MAX_SESSIONS
              value: {{ .Values.selenium.maxSessions | quote }}
            - name: SE_NODE_OVERRIDE_MAX_SESSIONS
              value: "true"
            # End a WebDriver session after this many seconds idle, so a leaked
            # browser context cannot pin a grid slot forever.
            - name: SE_NODE_SESSION_TIMEOUT
              value: {{ .Values.selenium.sessionTimeoutSecs | quote }}
            - name: SE_ENABLE_MANAGED_DOWNLOADS
              value: "false"
          ports:
            - name: http
              containerPort: {{ .Values.selenium.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.selenium.resources | nindent 12 }}
          volumeMounts:
            # Chrome needs a large /dev/shm; the container default (64Mi) makes
            # it crash on real pages. Back it with a memory emptyDir.
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.selenium.shmSizeLimit }}
{{- end }}
