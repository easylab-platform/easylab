{{- if .Values.imagePullSecrets.easylab.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecrets.easylab.name | default "easylab-regcred" }}
  namespace: {{ include "easylab.namespace" . }}
  labels:
    {{- include "easylab.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{%q:{"username":%q,"password":%q,"auth":%q}}}` (include "easylab.registryHost" .) .Values.imagePullSecrets.easylab.username .Values.imagePullSecrets.easylab.password (printf "%s:%s" .Values.imagePullSecrets.easylab.username .Values.imagePullSecrets.easylab.password | b64enc) | b64enc }}
{{- end }}
