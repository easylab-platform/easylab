apiVersion: apps/v1
kind: Deployment
metadata:
  name: easylab
  namespace: temp
  labels:
    app: easylab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easylab
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: easylab
    spec:
      hostUsers: true
      serviceAccountName: easylab
      securityContext: {}
      containers:
        # ---- easylab core (Go) — drives podman sidecar via Docker-compatible API
        - name: easylab
          image: forgejo.develop.10.199.64.20.nip.io/easylab/easylab:20260910081656
          imagePullPolicy: IfNotPresent
          args: ["-addr", "0.0.0.0:8080"]
          env:
            - name: EASYVCS_HOME
              value: /data
            # ---- 对外/给客户端宣告的地址（唯一用域名）：easylab 把 self_base /
            # OCI /token realm / 各协议 registry 的绝对 URL 写进响应，给 podman
            # 新拉起并对外暴露的服务 + 外部客户端回连。不可用 loopback。
            - name: EASYVCS_SELF_BASE
              value: http://easylab.temp.svc.cluster.local:8080
            # ---- 同 Pod 内部一律 loopback：easylab 自己用 docker/client 把
            # 构建产物 push 到本 Pod 共享 netns 里的 /v2（经 sidecar socket）。
            # 被拉起的 podman 服务仅被 easylab 单向驱动，无需回连 easylab，
            # 因此不用给它配域名。
            - name: EASYVCS_REGISTRY
              value: 127.0.0.1:8080
            - name: EASYVCS_SERVICES_BACKEND
              value: podman
            - name: EASYVCS_BUILD_BACKEND
              value: podman
            - name: EASYLAB_PODMAN_URI
              value: unix:///run/podman/podman.sock
            - name: DOCKER_HOST
              value: unix:///run/podman/podman.sock
            - name: EASYLAB_AGENT_URL
              value: http://127.0.0.1:8000
            - name: EASYLAB_OPSEXT_URL
              value: http://127.0.0.1:18092
            # ---- HTTP/2 偏好（默认=0 兼容 h1，客户端支持时用 h2c）；
            # =1 时才会拒绝 connect 路径上的 HTTP/1.x 请求（强制 h2c）
            - name: EASYVCS_ENFORCE_H2
              value: "0"
            # ---- HTTP/2 执法（可选）：=1 时拒绝 connect 路径上的 HTTP/1.x 请求
            # 设置为 devtoken，登录界面 token 填 devtoken。
            - name: EASYVCS_TOKEN
              value: devtoken
            # Produce build-args (publish/oci-build templates) must reach the
            # registry; empty made every npm/cargo publish target a dead URL.
            - name: EASYLAB_ARTIFACT_URL
              value: http://127.0.0.1:8080
            - name: ARTIFACT_TOKEN
              value: devtoken
            # ---- 服务容器与 easylab 共同的出站正向代理（部署可替换）。
            # easylab 回源 + 被拉起容器的普速出站（github 等非包流量）都走它；
            # 包制品（npm/pip/go/cargo）经 easylab pull-through 缓存，不走它。
            # 未设置则不注入 proxy env（容器直连）。NO_PROXY 覆盖 easylab 域
            # + 集群内网（.svc.cluster.local），保证内网直连。
            - name: EASYLAB_UPSTREAM_PROXY
              value: http://mihomo.develop.svc.cluster.local:7890
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits: { cpu: "2", memory: 2Gi }
            requests: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { mountPath: /data, name: data }
            - { mountPath: /run/podman, name: podman-sock }

        # ---- podman privileged sidecar (official) — runs the Docker-compatible service
        - name: podman
          image: forgejo.develop.10.199.64.20.nip.io/easylab/podman:official
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cat > /etc/containers/registries.conf.d/100-insecure.conf <<'EOF'\n[[registry]]\nlocation = \"127.0.0.1:8080\"\ninsecure = true\n[[registry]]\nlocation = \"easylab.temp.svc.cluster.local:8080\"\ninsecure = true\n[[registry]]\nlocation = \"forgejo.develop.10.199.64.20.nip.io\"\ninsecure = true\nEOF\nexec podman system service --time=0 unix:///run/podman/podman.sock"]
          env:
            - name: EASYLAB_EXT_TAG
              value: "20260907044106"
            - name: FORGEJO_USER
              value: root
            - name: FORGEJO_PASS
              value: devpassword
            - name: HTTP_PROXY
              value: http://mihomo.develop.svc.cluster.local:7890
            - name: HTTPS_PROXY
              value: http://mihomo.develop.svc.cluster.local:7890
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc.cluster.local,.svc,.nip.io,10.199.64.20,.develop.10.199.64.20.nip.io
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            runAsUser: 0
            seccompProfile: { type: Unconfined }
            capabilities:
              add: [SYS_ADMIN, NET_ADMIN, NET_RAW, SYS_PTRACE]
          resources:
            limits: { cpu: "2", memory: 2Gi }
            requests: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { mountPath: /data/oci, name: data, subPath: oci }
            - { mountPath: /data/logs, name: data, subPath: logs }
            - { mountPath: /sys/fs/cgroup, name: cgroup }
            - { mountPath: /run/podman, name: podman-sock }

        # ---- nats
        - name: nats
          image: forgejo.develop.10.199.64.20.nip.io/easylab/nats:latest
          imagePullPolicy: IfNotPresent
          args: ["-js", "-p", "4222", "-m", "8222", "-sd", "/data/nats"]
          ports:
            - containerPort: 4222
              protocol: TCP
          resources:
            limits: { cpu: 500m, memory: 512Mi }
            requests: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { mountPath: /data/nats, name: data, subPath: nats }

        # ---- agent (abc session backend)
        - name: agent
          image: forgejo.develop.10.199.64.20.nip.io/easylab/agent:20260910060820
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://127.0.0.1:4222
            - name: DB_BACKEND
              value: sqlite
            - name: DATABASE_URL
              value: sqlite:///data/agent.db
            # New agent config reads PORT (config.ts). Keep listening on 8000
            # so easylab's gateway (EASYLAB_AGENT_URL=http://127.0.0.1:8000)
            # keeps working on the shared pod netns.
            - name: PORT
              value: "8000"
            # In-pod callers (easylab gateway h2cClient, easylab-sdk-go) speak
            # cleartext HTTP/2 prior-knowledge — the agent must serve h2c.
            - name: HTTP_PROTOCOL
              value: h2c
            # Host-specific system presets (plan/explore/build), injected at
            # deploy time. The generic agent only ships `default`; these ship
            # with easylab and are seeded as immutable presets at boot.
            - name: SYSTEM_PRESETS_FILE
              value: /etc/agent-presets/presets.json
            - name: DEFAULT_PRESET
              value: build
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            limits: { cpu: "1", memory: 1Gi }
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { mountPath: /data, name: data, subPath: agent-data }
            - { mountPath: /etc/agent-presets, name: presets, readOnly: true }

      volumes:
        - name: data
          hostPath:
            path: /home/develop/.easylab
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: podman-sock
          emptyDir: {}
        - name: presets
          configMap:
            name: easylab-presets

---
# In-cluster entrypoint for the abc agent (abcp-sdk/agent): cleartext
# HTTP/2 (h2c prior knowledge) into the easylab pod's agent container.
# Consumers use the Go agentsdk / TS @easylab/sdk/node createAgentClient.
# The zergx agent is deprecated — everything targets this service.
apiVersion: v1
kind: Service
metadata:
  name: abcp-agent
  namespace: temp
  labels:
    app: easylab
spec:
  type: ClusterIP
  selector:
    app: easylab
  ports:
    - name: h2c
      port: 80
      targetPort: 8000
