apiVersion: apps/v1
kind: Deployment
metadata:
  name: standalone-agent
  namespace: temp
  labels:
    app: standalone-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standalone-agent
  template:
    metadata:
      labels:
        app: standalone-agent
    spec:
      serviceAccountName: easylab
      securityContext: {}
      containers:
        # ---- nats (JetStream KV for presets / agent-config / file meta) ----
        - name: nats
          image: forgejo.develop.10.199.64.20.nip.io/easylab/nats:latest
          imagePullPolicy: IfNotPresent
          args: ["-js", "-p", "4222", "-m", "8222", "-sd", "/data/nats"]
          ports:
            - { containerPort: 4222, protocol: TCP }
          resources:
            limits: { cpu: 500m, memory: 512Mi }
            requests: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { mountPath: /data/nats, name: data, subPath: nats }

        # ---- abcp agent (session/model/turn engine; h2c on 8000) ----
        - name: agent
          image: forgejo.develop.10.199.64.20.nip.io/abcp/agent:20260919095441
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://127.0.0.1:4222
            - name: DB_BACKEND
              value: sqlite
            - name: DATABASE_URL
              value: sqlite:///data/agent.db
            - name: PORT
              value: "8080"
            # Trust the dev cluster CA so provider base URLs on *.nip.io
            # (self-signed chain) verify — e.g. the easylab gateway used as an
            # openai-compatible provider for ASR/TTS/image models.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/dev-ca.crt
            # Browser (Flutter Web) clients are cross-origin; allow the hosted
            # web app's origin (or "*" for dev).
            - name: AGENT_CORS_ORIGIN
              value: "*"
            # Multi-tenant auth: bearer tokens resolve to tenants. The admin
            # token manages tenants; the bootstrap pair seeds the first tenant.
            - name: AGENT_AUTH_MODE
              value: "required"
            - name: AGENT_ADMIN_TOKEN
              value: "dev-admin-token"
            - name: AGENT_BOOTSTRAP_TENANT
              value: "default"
            - name: AGENT_BOOTSTRAP_TOKEN
              value: "devtenanttoken"
          ports:
            - { containerPort: 8080, protocol: TCP }
          resources:
            limits: { cpu: "1", memory: 1Gi }
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { mountPath: /data, name: data, subPath: agent-data }
            - { mountPath: /etc/ssl/certs/dev-ca.crt, name: ca, subPath: ca.crt, readOnly: true }

      volumes:
        - name: data
          hostPath:
            path: /home/develop/.easylab/standalone-agent
            type: DirectoryOrCreate
        - name: ca
          configMap:
            name: standalone-agent-ca
---
apiVersion: v1
kind: Service
metadata:
  name: standalone-agent
  namespace: temp
  labels:
    app: standalone-agent
spec:
  type: ClusterIP
  selector:
    app: standalone-agent
  ports:
    - name: h2c
      port: 80
      targetPort: 8080
---
# Expose the in-pod NATS broker so a separate extension server (playwright)
# can register/discover and answer tool calls. The agent and NATS share the pod
# netns; this Service only makes the broker reachable from another pod.
apiVersion: v1
kind: Service
metadata:
  name: standalone-agent-nats
  namespace: temp
  labels:
    app: standalone-agent
spec:
  type: ClusterIP
  selector:
    app: standalone-agent
  ports:
    - name: nats
      port: 4222
      targetPort: 4222
---
# Playwright browser-automation extension server. Drives a remote Selenium
# (standalone-chrome) node over CDP; screenshots flow back through the agent's
# file.ingest RPC as durable file:<code>. One context per browser session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-extension
  namespace: temp
  labels:
    app: playwright-extension
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-extension
  template:
    metadata:
      labels:
        app: playwright-extension
    spec:
      securityContext: {}
      containers:
        - name: playwright-extension
          image: forgejo.develop.10.199.64.20.nip.io/abcp/playwright-extension:20260919095319
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://standalone-agent-nats.temp.svc.cluster.local:4222
            # Selenium (standalone-chrome) WebDriver endpoint the user deploys.
            - name: PLAYWRIGHT_SELENIUM_URL
              value: http://selenium.temp.svc.cluster.local:4444
            - name: PLAYWRIGHT_BROWSER
              value: chrome
            - name: PLAYWRIGHT_VIEWPORT
              value: "1280x720"
            # Close a browser context after 10 min idle; cap live contexts.
            - name: PLAYWRIGHT_IDLE_TIMEOUT_MS
              value: "600000"
            - name: PLAYWRIGHT_MAX_CONTEXTS
              value: "8"
          ports:
            - { containerPort: 8080, protocol: TCP }
          resources:
            limits: { cpu: "1", memory: 512Mi }
            requests: { cpu: 50m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-extension
  namespace: temp
  labels:
    app: playwright-extension
spec:
  type: ClusterIP
  selector:
    app: playwright-extension
  ports:
    - name: http
      port: 80
      targetPort: 8080
