apiVersion: apps/v1
kind: Deployment
metadata:
  name: easylab-web
  namespace: temp
  labels:
    app: easylab-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easylab-web
  template:
    metadata:
      labels:
        app: easylab-web
    spec:
      containers:
        - name: web
          image: forgejo.develop.10.199.64.20.nip.io/easylab/easylab-web:20260913154715
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 20m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: easylab-web
  namespace: temp
  labels:
    app: easylab-web
spec:
  type: ClusterIP
  selector:
    app: easylab-web
  ports:
    - { name: http, port: 80, targetPort: 8080 }
