# repo-extension protocol manifest — single declarative source for the
# extension's wire protocol (tools + session variables + lifecycle). Handler
# and resolver bindings stay in code (tools.go / variables.go).
id: repo
version: 0.5.0
lifecycle: [created, forked, renamed, deleted]
variables:
  - name: org
    scope: session
    description: Organization of the current workspace (session variable, from the mapping table).
    descriptions:
      zh: 当前工作区的组织（会话变量，来自映射表）。
  - name: repo
    scope: session
    description: Repository name of the current workspace (session variable, from the mapping table).
    descriptions:
      zh: 当前工作区的仓库名称（会话变量，来自映射表）。
  - name: branch
    scope: session
    description: Branch of the current workspace (session variable, from the mapping table).
    descriptions:
      zh: 当前工作区所在分支（会话变量，来自映射表）。
tools:
  - name: read
    description: Read a file from a repository revision, returning line-numbered (1-based) content. Use offset/limit to read large files in segments. `ref` is a full 'org:repo:<rev>' path (rev = branch / commit hash / tag / change id); omitted = the current workspace.
    descriptions:
      zh: 从仓库某个修订读取文件，返回带行号（从 1 开始）的内容。用 offset/limit 分段读取大文件。`ref` 是完整的 'org:repo:<rev>' 路径（rev = branch / commit hash / tag / change id）；省略 = 当前工作区。
    input_schema:
      type: object
      properties:
        ref:
          type: string
          description: Full 'org:repo:<rev>' path (rev may be a branch, commit hash, tag or change id). Omitted = current workspace.
          descriptions:
            zh: 完整的 'org:repo:<rev>' 路径（rev 可为 branch、commit hash、tag 或 change id）。省略 = 当前工作区。
        path:
          type: string
          description: File path to read (relative to the repository root).
          descriptions:
            zh: 要读取的文件路径（相对于仓库根目录）。
        offset:
          type: integer
          description: Starting line number (1-based, default 1).
          descriptions:
            zh: 起始行号（从 1 开始，默认 1）。
        limit:
          type: integer
          description: Maximum number of lines to read (0/omitted = read to end of file).
          descriptions:
            zh: 最多读取的行数（0/省略 = 读到文件末尾）。
      required: [path]
  - name: write
    description: Create or overwrite a file in the repository (committed as one change).
    descriptions:
      zh: 创建或覆盖仓库中的文件（作为一个变更提交）。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to create/overwrite (relative to the repository root).
          descriptions:
            zh: 要创建/覆盖的文件路径（相对于仓库根目录）。
        content:
          type: string
          description: Full file content.
          descriptions:
            zh: 完整文件内容。
        message:
          type: string
          description: Commit message (defaults to "write <path>").
          descriptions:
            zh: 提交信息（默认 "write <path>"）。
      required: [path, content]
  - name: delete
    description: Delete a file from the repository (committed as one change).
    descriptions:
      zh: 删除仓库中的文件（作为一个变更提交）。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to delete (relative to the repository root).
          descriptions:
            zh: 要删除的文件路径（相对于仓库根目录）。
        message:
          type: string
          description: Commit message (defaults to "delete <path>").
          descriptions:
            zh: 提交信息（默认 "delete <path>"）。
      required: [path]
  - name: edit
    description: Replace or insert file content by line number. Reads and validates the current file first, applies the line edit, then writes back with sha verification to prevent clobbering concurrent edits.
    descriptions:
      zh: 按行号替换或插入文件内容。先读取并校验当前文件，应用行编辑，再带 sha 校验写回，防止并发编辑互相覆盖。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to edit (relative to the repository root).
          descriptions:
            zh: 要编辑的文件路径（相对于仓库根目录）。
        start-line:
          type: integer
          description: Start line (1-based); when end_line < start_line, inserts before start_line.
          descriptions:
            zh: 起始行（从 1 开始）；当 end_line < start_line 时，在 start_line 前插入。
        end-line:
          type: integer
          description: End line (1-based, inclusive); less than start_line means insert mode.
          descriptions:
            zh: 结束行（从 1 开始，含端点）；小于 start_line 表示插入模式。
        content:
          type: string
          description: Replacement or inserted content.
          descriptions:
            zh: 替换或插入的内容。
        message:
          type: string
          description: Commit message (defaults to "edit <path>").
          descriptions:
            zh: 提交信息（默认 "edit <path>"）。
      required: [path, start-line, end-line, content]
  - name: ls
    description: List files and directories at a repository revision's tree root. `ref` is a full 'org:repo:<rev>' path (rev = branch / commit hash / tag / change id); omitted = the current workspace.
    descriptions:
      zh: 列出某个仓库修订的目录树根下的文件与目录。`ref` 是完整的 'org:repo:<rev>' 路径（rev = branch / commit hash / tag / change id）；省略 = 当前工作区。
    input_schema:
      type: object
      properties:
        ref:
          type: string
          description: Full 'org:repo:<rev>' path (rev may be a branch, commit hash, tag or change id). Omitted = current workspace.
          descriptions:
            zh: 完整的 'org:repo:<rev>' 路径（rev 可为 branch、commit hash、tag 或 change id）。省略 = 当前工作区。
  - name: grep
    description: Search file contents with a regular expression at a repository revision. `ref` is a full 'org:repo:<rev>' path (rev = branch / commit hash / tag / change id); omitted = the current workspace.
    descriptions:
      zh: 在某个仓库修订下用正则表达式搜索文件内容。`ref` 是完整的 'org:repo:<rev>' 路径（rev = branch / commit hash / tag / change id）；省略 = 当前工作区。
    input_schema:
      type: object
      properties:
        ref:
          type: string
          description: Full 'org:repo:<rev>' path (rev may be a branch, commit hash, tag or change id). Omitted = current workspace.
          descriptions:
            zh: 完整的 'org:repo:<rev>' 路径（rev 可为 branch、commit hash、tag 或 change id）。省略 = 当前工作区。
        pattern:
          type: string
          description: Regular expression to search file contents.
          descriptions:
            zh: 用于搜索文件内容的正则表达式。
      required: [pattern]
  - name: explore
    description: Browse the organization/repository/branch structure. Optionally filter org/repo names with `keyword`; a repo's branches are shown in its result.
    descriptions:
      zh: 浏览组织/仓库/分支结构。可用 `keyword` 筛选组织/仓库名称；仓库的分支会随结果一并展示。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization name (omitted = list all organizations).
          descriptions:
            zh: 组织名（省略 = 列出所有组织）。
        keyword:
          type: string
          description: Case-insensitive substring matched against org and repo names.
          descriptions:
            zh: 对组织名与仓库名做大小写不敏感的子串匹配。
        repo:
          type: string
          description: Repository name (omitted = list all repositories in the org).
          descriptions:
            zh: 仓库名（省略 = 列出该组织下所有仓库）。
  - name: vcs-rebase
    description: Rebase the commits unique to `source` onto this session's branch (the current workspace branch). The current branch advances (linear history; source change ids are preserved). The destination is always the session's own branch and cannot be overridden.
    descriptions:
      zh: 把 `source` 分支上独有的提交变基到本会话分支（当前工作区分支）上。当前分支向前推进（线性历史；保留源码 change id）。目标始终是本会话自己的分支，不可覆盖。
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: Branch whose commits are rebased onto the current workspace branch.
          descriptions:
            zh: 将其独有提交变基到当前工作区分支的分支。
      required: [source]
  - name: vcs-resolve
    description: Resolve a conflict on this session's branch by writing the resolved content for a conflicted path. The branch tip must be in a conflicted state (e.g. after an unsuccessful rebase); read the path first (it renders with git-style conflict markers) to obtain the merged content, then write the final resolution here.
    descriptions:
      zh: 通过为冲突路径写入最终内容来解析本会话分支上的冲突。分支尖端必须处于冲突状态（例如一次失败的变基后）；先读取该路径（会渲染 git 风格冲突标记），得到合并内容后在此写入最终解析。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Repo-relative path of the conflicted file to resolve.
          descriptions:
            zh: 待解析冲突文件的仓库相对路径。
        content:
          type: string
          description: Full resolved file content to write at `path`.
          descriptions:
            zh: 写入 `path` 的最终解析内容。
      required: [path, content]
  - name: vcs-graph
    description: View the commit graph (topology with HEAD marks) of a repository revision. Use `ref` to point at another org:repo[:<rev>]; shows commit ids, change ids, authors, parents and is_head.
    descriptions:
      zh: 查看某个仓库修订的提交图（含拓扑与 HEAD 标记）。用 `ref` 指向其他 org:repo[:<rev>]；展示 commit id、change id、作者、父提交与 is_head。
    input_schema:
      type: object
      properties:
        ref:
          type: string
          description: Full 'org:repo:<rev>' path (rev = branch / commit hash / tag / change id). Omitted = current workspace.
          descriptions:
            zh: 完整的 'org:repo:<rev>' 路径（rev 可为 branch、commit hash、tag 或 change id）。省略 = 当前工作区。
        limit:
          type: integer
          description: Maximum nodes to return (default 100).
          descriptions:
            zh: 最多返回的节点数（默认 100）。
  - name: vcs-diff
    description: Compare file differences between two revisions, or the whole tree when `path` is omitted.
    descriptions:
      zh: 比较两个版本之间的文件差异；省略 path 时比较整棵树的差异。
    input_schema:
      type: object
      properties:
        rev-a:
          type: string
          description: Start revision (change ID or branch).
          descriptions:
            zh: 起始版本（change ID 或分支）。
        rev-b:
          type: string
          description: End revision (change ID or branch).
          descriptions:
            zh: 结束版本（change ID 或分支）。
        path:
          type: string
          description: Optional file path; omitted = whole-tree diff between the two revisions.
          descriptions:
            zh: 可选文件路径；省略 = 两版本间的整树差异。
      required: [rev_a, rev_b]
  - name: vcs-blame
    description: Annotate each line of a file with the change that introduced it.
    descriptions:
      zh: 逐行标注文件的变更来源。
    input_schema:
      type: object
      properties:
        rev:
          type: string
          description: Revision to trace (change ID or branch; defaults to the branch head).
          descriptions:
            zh: 要追溯的版本（change ID 或分支；默认分支头）。
        path:
          type: string
          description: File path to trace.
          descriptions:
            zh: 要追溯的文件路径。
      required: [rev, path]
  - name: vcs-log
    description: View commit history, optionally scoped to a branch and a time window.
    descriptions:
      zh: 查看提交历史，可限定分支与时间窗。
    input_schema:
      type: object
      properties:
        rev:
          type: string
          description: "Branch or change id to start from (default: current branch head)."
          descriptions:
            zh: 分支或 change id（默认：当前分支头）。
        since:
          type: string
          description: Inclusive lower time bound (YYYY-MM-DD or RFC3339).
          descriptions:
            zh: 含端点的下界时间（YYYY-MM-DD 或 RFC3339）。
        until:
          type: string
          description: Inclusive upper time bound (YYYY-MM-DD or RFC3339).
          descriptions:
            zh: 含端点的上界时间（YYYY-MM-DD 或 RFC3339）。
        limit:
          type: integer
          description: Maximum number of commits to return (default 50).
          descriptions:
            zh: 最多返回的提交数（默认 50）。
  - name: vcs-show
    description: View what a change modified.
    descriptions:
      zh: 查看某个变更修改了什么。
    input_schema:
      type: object
      properties:
        rev:
          type: string
          description: Change ID.
          descriptions:
            zh: change ID。
      required: [rev]
  - name: vcs-branch-list
    description: List the current repository's branches (own repo only).
    descriptions:
      zh: 列出当前仓库的分支（仅限本仓库）。
    input_schema:
      type: object
      properties: {}

  - name: vcs-branch-create
    description: "Create a branch in the current repository from `from` (default: the session branch). Own repo only."
    descriptions:
      zh: 在当前仓库中从 `from`（默认：会话分支）创建分支。仅限本仓库。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: New branch name.
          descriptions:
            zh: 新分支名。
        from:
          type: string
          description: "Source branch/rev (default: the session branch)."
          descriptions:
            zh: 源分支/修订（默认：会话分支）。
      required: [name]

  - name: vcs-branch-delete
    description: Delete a branch in the current repository. Own repo only.
    descriptions:
      zh: 删除当前仓库中的分支。仅限本仓库。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Branch name to delete.
          descriptions:
            zh: 要删除的分支名。
      required: [name]

  - name: vcs-tag-list
    description: List the current repository's tags.
    descriptions:
      zh: 列出当前仓库的标签。
    input_schema:
      type: object
      properties: {}

  - name: vcs-tag-set
    description: "Create/move a tag in the current repository (default target: the session branch head). Own repo only."
    descriptions:
      zh: 在当前仓库创建/移动标签（默认目标：会话分支头）。仅限本仓库。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Tag name.
          descriptions:
            zh: 标签名。
        target:
          type: string
          description: "Target revision (default: current branch head)."
          descriptions:
            zh: 目标修订（默认：当前分支头）。
      required: [name]

  - name: vcs-tag-delete
    description: Delete a tag in the current repository.
    descriptions:
      zh: 删除当前仓库中的标签。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Tag name.
          descriptions:
            zh: 标签名。
      required: [name]

  - name: vcs-mr-create
    description: Open a change request (merge request) in the current repository. Own repo only.
    descriptions:
      zh: 在当前仓库创建合并请求。仅限本仓库。
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Title.
          descriptions:
            zh: 标题。
        source:
          type: string
          description: Source branch.
          descriptions:
            zh: 源分支。
        target:
          type: string
          description: Target branch.
          descriptions:
            zh: 目标分支。
        description:
          type: string
          description: Optional description.
          descriptions:
            zh: 可选描述。
      required: [title, source, target]

  - name: vcs-mr-list
    description: "List the current repository's change requests (optional state filter: open|merged|closed)."
    descriptions:
      zh: 列出当前仓库的合并请求（可选状态：open|merged|closed）。
    input_schema:
      type: object
      properties:
        state:
          type: string
          description: State filter.
          descriptions:
            zh: 状态过滤。

  - name: vcs-mr-get
    description: Show one change request by iid.
    descriptions:
      zh: 按 iid 展示某个合并请求。
    input_schema:
      type: object
      properties:
        iid:
          type: string
          description: Change-request iid.
          descriptions:
            zh: 合并请求 iid。
      required: [iid]

  - name: vcs-mr-review
    description: "Submit a review (state: approved|request_changes|comment) on a change request."
    descriptions:
      zh: 提交评审（state：approved|request_changes|comment）。
    input_schema:
      type: object
      properties:
        iid:
          type: string
          description: Change-request iid.
          descriptions:
            zh: 合并请求 iid。
        state:
          type: string
          description: Review state.
          descriptions:
            zh: 评审状态。
        body:
          type: string
          description: Optional review body.
          descriptions:
            zh: 可选评审内容。
      required: [iid, state]

  - name: vcs-mr-review-list
    description: List reviews on a change request.
    descriptions:
      zh: 列出某合并请求的评审。
    input_schema:
      type: object
      properties:
        iid:
          type: string
          description: Change-request iid.
          descriptions:
            zh: 合并请求 iid。
      required: [iid]

  - name: vcs-mr-comment
    description: Comment on a change request (optional file path).
    descriptions:
      zh: 在合并请求上评论（可选文件路径）。
    input_schema:
      type: object
      properties:
        iid:
          type: string
          description: Change-request iid.
          descriptions:
            zh: 合并请求 iid。
        body:
          type: string
          description: Comment body.
          descriptions:
            zh: 评论内容。
        path:
          type: string
          description: Optional file path.
          descriptions:
            zh: 可选文件路径。
      required: [iid, body]

  - name: vcs-mr-comment-list
    description: List comments on a change request.
    descriptions:
      zh: 列出某合并请求的评论。
    input_schema:
      type: object
      properties:
        iid:
          type: string
          description: Change-request iid.
          descriptions:
            zh: 合并请求 iid。
      required: [iid]

  - name: vcs-mr-merge
    description: Merge a change request. ALLOWED ONLY FROM THE SESSION WHOSE BRANCH IS THE REPOSITORY'S DEFAULT BRANCH (e.g. main).
    descriptions:
      zh: 合并合并请求。仅允许分支为该仓库默认分支（如 main）的会话执行。
    input_schema:
      type: object
      properties:
        iid:
          type: string
          description: Change-request iid.
          descriptions:
            zh: 合并请求 iid。
      required: [iid]

  - name: vcs-repo-config
    description: Update the repository's settings (visibility public|private, description, default-branch). Own repo only.
    descriptions:
      zh: 更新仓库设置（visibility public|private、description、default-branch）。仅限本仓库。
    input_schema:
      type: object
      properties:
        visibility:
          type: string
          description: public|private.
          descriptions:
            zh: public|private。
        description:
          type: string
          description: Repository description.
          descriptions:
            zh: 仓库描述。
        default-branch:
          type: string
          description: Default branch name.
          descriptions:
            zh: 默认分支名。

  - name: vcs-release-create
    description: Create a release (tag) in the current repository.
    descriptions:
      zh: 在当前仓库创建 release（tag）。
    input_schema:
      type: object
      properties:
        tag:
          type: string
          description: Release tag.
          descriptions:
            zh: Release 标签。
        name:
          type: string
          description: Display name.
          descriptions:
            zh: 显示名。
        description:
          type: string
          description: Description.
          descriptions:
            zh: 描述。
        target:
          type: string
          description: Target revision.
          descriptions:
            zh: 目标修订。
        draft:
          type: string
          description: Draft (true|false).
          descriptions:
            zh: 草稿（true|false）。
        prerelease:
          type: string
          description: Prerelease (true|false).
          descriptions:
            zh: 预发布（true|false）。
      required: [tag]

  - name: vcs-release-list
    description: List the current repository's releases.
    descriptions:
      zh: 列出当前仓库的 release。
    input_schema:
      type: object
      properties: {}

  - name: vcs-release-delete
    description: Delete a release by tag.
    descriptions:
      zh: 按标签删除 release。
    input_schema:
      type: object
      properties:
        tag:
          type: string
          description: Release tag.
          descriptions:
            zh: Release 标签。
      required: [tag]

  - name: vcs-release-upload
    description: Upload a text asset to a release.
    descriptions:
      zh: 向 release 上传文本资产。
    input_schema:
      type: object
      properties:
        tag:
          type: string
          description: Release tag.
          descriptions:
            zh: Release 标签。
        name:
          type: string
          description: Asset file name.
          descriptions:
            zh: 资产文件名。
        content:
          type: string
          description: Asset text content.
          descriptions:
            zh: 资产文本内容。
        content-type:
          type: string
          description: Optional MIME type.
          descriptions:
            zh: 可选 MIME 类型。
      required: [tag, name]

  - name: vcs-release-download
    description: Download a release asset into the shared /data downloads dir and return its path + size (bytes are never inlined).
    descriptions:
      zh: 下载 release 资产到共享 /data downloads 目录并返回路径与大小（不内联字节）。
    input_schema:
      type: object
      properties:
        tag:
          type: string
          description: Release tag.
          descriptions:
            zh: Release 标签。
        name:
          type: string
          description: Asset name.
          descriptions:
            zh: 资产名。
      required: [tag, name]

  - name: vcs-package-visibility
    description: Set a package's visibility (public|private); requires maintainer+ on the package's scope.
    descriptions:
      zh: 设置包的可见性（public|private）；需对包所属 scope 具备 maintainer+。
    input_schema:
      type: object
      properties:
        type:
          type: string
          description: Registry format (npm/oci/…).
          descriptions:
            zh: 注册表格式（npm/oci 等）。
        name:
          type: string
          description: Package name.
          descriptions:
            zh: 包名。
        visibility:
          type: string
          description: public|private.
          descriptions:
            zh: public|private。
      required: [type, name, visibility]

